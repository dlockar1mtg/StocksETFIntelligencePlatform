name: ETF hosted market data

on:
  schedule:
    - cron: "20 22 * * 1-5"   # daily after the US close
    - cron: "20 4 * * 2-6"    # backup: skipped when >= 90% of funds already have the last completed session (one backup: each gate bills a minute)
    - cron: "20 14 * * 6"     # Saturday: full-history refresh of every fund (policy full_refresh_weekday)
  pull_request:
    paths:
      - "foundation/market/hosted_market_data.py"
      - "foundation/market/daily_series.py"
      - "foundation/infrastructure/yahoo_chart_daily.py"
      - "scripts/run_hosted_etf_market_data.py"
      - "config/market/hosted_market_data_policy.json"
      - "config/market/provisional_ranking_policy.json"
      - "config/market/provisional_full_coverage_policy.json"
      - "foundation/market/provisional_*.py"
      - "foundation/market/sec_expense_ratios.py"
      - "foundation/market/uip_package.py"
      - "scripts/research_provisional_ranking.py"
      - "scripts/research_provisional_full_coverage.py"
      - "scripts/build_provisional_etf_package.py"
      - "scripts/etf_backup_gate.py"
      - ".github/workflows/etf-hosted-market-data.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch full history for every fund"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: etf-hosted-market-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          sparse-checkout: |
            foundation/__init__.py
            foundation/market/daily_series.py
            config/market/hosted_market_data_policy.json
            scripts/etf_backup_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" = "20 14 * * 6" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 2026-10-09 (system audit): skip only when >= 90% of funds in the committed status already have
          # as_of_date == the last completed US session at run time (weekends and NYSE holidays), never on the
          # stored CURRENT labels, which were computed when the status was written. The raw media type reads
          # files over the contents API's 1 MB JSON limit.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/data/curated/hosted_etf/market_data_status.json?ref=$BRANCH" > status.json || echo '{}' > status.json
          python3 scripts/etf_backup_gate.py status.json | tee gate.out
          grep -E '^run=(true|false)$' gate.out | tail -1 >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy scipy
      - name: Tests
        run: python -m unittest tests.market.test_hosted_market_data tests.market.test_provisional_ranking tests.market.test_provisional_package tests.market.test_sec_expense_ratios tests.market.test_provisional_projection tests.market.test_provisional_full_coverage tests.market.test_audit_fixes_2026_10 -v
      - name: Restore the cached daily series
        uses: actions/cache/restore@v4
        with:
          path: data/hosted_cache/etf_daily
          key: etf-daily-v1-${{ github.run_id }}
          restore-keys: etf-daily-v1-
      - name: Update every fund and write month-end features
        run: |
          flag=""
          if [ "${{ inputs.full }}" = "true" ]; then flag="--full"; fi
          python scripts/run_hosted_etf_market_data.py $flag
          python - <<'PY'
          import json
          s = json.load(open("data/curated/hosted_etf/market_data_status.json"))
          bad = [f for f in s["funds"] if f["failures"]]
          print(f"::notice title=ETF hosted data::{s['fund_count']} funds, mode {s['mode']}, quality {s['quality_summary']}, freshness {s['freshness_summary']}, feature rows {s['feature_rows']}")
          for f in bad[:40]:
              print(f"::warning title=ETF {f['symbol']}::{f['quality_status']} {'; '.join(f['failures'])[:300]}")
          PY
      - name: Previous published package (call hysteresis and kept group assignments)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("etf-production-")) | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')" || id=""
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > previous.zip && unzip -o -q previous.zip funds.json -d previous; then
            echo "Previous package: artifact $id"
          else
            rm -rf previous; echo "No previous package artifact; the saved state (data/curated/hosted_etf/package_state.json) is used if present."
          fi
      - name: Ranking research, timing evidence and the provisional UIP package
        run: |
          python scripts/research_provisional_ranking.py > research.log && tail -6 research.log
          python scripts/research_provisional_projection.py > projection.log && tail -3 projection.log
          python scripts/research_provisional_full_coverage.py > coverage.log && tail -2 coverage.log
          prev=""; if [ -f previous/funds.json ]; then prev="--previous previous/funds.json"; fi
          python scripts/build_provisional_etf_package.py --output etf-package $prev | tee package.log
          python - <<'PY'
          import json
          m = json.load(open("etf-package/manifest.json"))
          print(f"::notice title=ETF package::{m['package_id']} {m['validation_status']} {m['certification_status']} | {open('package.log').read().strip()[-300:]}")
          r = json.load(open("etf-package/research.json"))
          print(f"::notice title=ETF ranking gate::{json.dumps(r['gate'])}")
          pt = r.get("projection_test") or {}
          print(f"::notice title=ETF 3-year projections::band coverage {pt.get('overall', {}).get('inside_10_90')} over {pt.get('observations')} fund-years; families {json.dumps(pt.get('family_status'))}")
          fc = r.get("full_coverage_test") or {}
          print(f"::notice title=ETF own-history outlooks::{fc.get('observations')} fund-years; {json.dumps({k: (v.get('n'), v.get('inside_10_90')) for k, v in (fc.get('categories') or {}).items()})}; status {json.dumps(fc.get('category_status'))}")
          cov = json.loads(open('package.log').read().strip().splitlines()[-1]).get("coverage", {})
          print(f"::notice title=ETF coverage::3-year projection {cov.get('projection_3y')}, own-history outlook {cov.get('outlook_3y')}, loose-peer readings {cov.get('loose_peer_reading')}, neither {len(cov.get('neither') or [])}: {' '.join((cov.get('neither') or [])[:40])}")
          for fam, rules in r["timing"].items():
              passing = [k for k, v in rules.items() if k != "_now" and v.get("passes_gate")]
              print(f"::notice title=ETF timing {fam}::passing rules {passing or 'none'}")
          PY
      - name: Publish the package for the UIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: etf-production-${{ github.run_id }}
          path: etf-package/
          if-no-files-found: error
          retention-days: 7
      - name: Keep the package from this check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: etf-package-check-${{ github.run_id }}
          path: etf-package/
          retention-days: 7
      - name: Save the daily series
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/hosted_cache/etf_daily
          key: etf-daily-v1-${{ github.run_id }}
      - name: Commit features and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated/hosted_etf
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "ETF hosted market data $(date -u +%F)"
          branch="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::Branch $branch no longer exists (merged or deleted during the run); nothing kept."
            exit 0
          fi
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
