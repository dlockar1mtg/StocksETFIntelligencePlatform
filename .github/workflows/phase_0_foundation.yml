name: Phase 0 Foundation

on:
  push:
    branches:
      - main
      - phase-0.2-repository-foundation
      - phase-0.3-contracts-configuration
      - phase-0.4-source-authority-data-zones
      - phase-0-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install --quiet pytest numpy scipy
      - name: Validate environment
        run: python scripts/validate_environment.py
      - name: Run all regression tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: Run complete Phase 0 certification
        run: python scripts/certify_phase_0_7.py
