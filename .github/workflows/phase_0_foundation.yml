name: Phase 0 Foundation

on:
  push:
    branches:
      - main
      - phase-0.2-repository-foundation
      - phase-0.3-contracts-configuration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate environment
        run: python scripts/validate_environment.py
      - name: Run all regression tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: Run Phase 0.3 certification
        run: python scripts/certify_phase_0_3.py
